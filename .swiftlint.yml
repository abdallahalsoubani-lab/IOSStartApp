disabled_rules:
  - line_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - force_unwrapping

opt_in_rules:
  - force_unwrapping
  - discouraged_direct_init
  - explicit_init
  - private_unit_test
  - unavailable_function
  - unneeded_parentheses_in_closure_argument

excluded:
  - Pods
  - .build
  - Generated

rules:
  identifier_name:
    min_length: 2
    max_length: 50
    excluded:
      - id
      - x
      - y
      - z

  line_length:
    warning: 120
    error: 200

  file_length:
    warning: 500
    error: 1000

  function_body_length:
    warning: 50
    error: 100

  type_body_length:
    warning: 300
    error: 500

  nesting:
    type_level: 2
    function_level: 2

  indentation_width:
    indentation_width: 4

  trailing_whitespace:
    ignores_empty_lines: true

  vertical_whitespace:
    max_empty_lines: 2

reporter: "xcode"

allow_zero_lintable_files: true
